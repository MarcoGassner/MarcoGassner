<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marco Gassner</title>

<style>
:root{
  --text:#111;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:Inter,system-ui,-apple-system;
  
  /* ✨ kreativer Hintergrund */
  background: linear-gradient(120deg, #e0f2ff, #fdfbfb, #ffe0f7);
  background-size: 300% 300%;
  animation: bgMove 12s ease infinite;

  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ---------- SWIM LINE ---------- */

.swim-line{
  position:fixed;
  top:20px;
  left:-120px;
  width:100px;
  height:3px;
  background:black;
  animation: swim 6s linear infinite;
  z-index:100;
}

.swimmer-head{
  position:absolute;
  right:-10px;
  top:-6px;
  width:12px;
  height:12px;
  background:black;
  border-radius:50%;
  animation: headMove 6s linear infinite;
}

/* Bewegung */
@keyframes swim{
  0%{left:-120px;}
  100%{left:100%;}
}

/* Kopf dreht sich */
@keyframes headMove{
  0%, 70%{
    transform:rotate(0deg);
  }
  75%{
    transform:rotate(-40deg);
  }
  85%{
    transform:rotate(0deg);
  }
}

/* ---------- LAYOUT ---------- */

.wrap{
  max-width:1000px;
  margin:auto;
  padding:40px 20px;
}

/* TEXT */

h1{
  font-size:40px;
  margin-bottom:10px;
}

.small-text{
  font-size:14px;
  opacity:0.7;
  margin-bottom:30px;
}

.section{
  margin-top:40px;
}

a{
  display:block;
  margin:8px 0;
  color:black;
  text-decoration:underline;
}

</style>
</head>

<body>

<!-- 🏊 ANIMATION -->
<div class="swim-line">
  <div class="swimmer-head"></div>
</div>

<div class="wrap">

  <h1>Hello</h1>

  <!-- kleiner gemacht -->
  <p class="small-text">Good to have you here.</p>

  <!-- dein Inhalt bleibt -->
  <div class="section">
    <a href="#">Project 1</a>
    <a href="#">Project 2</a>
    <a href="#">Project 3</a>
  </div>

  <div class="section">
    <a href="#">Instagram</a>
    <a href="#">LinkedIn</a>
  </div>

</div>

</body>
</html>
