<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marco Gassner</title>

<style>
:root{
  --text:#111111;
  --muted:#444444;
  --line:rgba(0,0,0,.10);
  --accent:#2f80ed;
  --bg:#f5f8fc;
  --panel:rgba(255,255,255,.90);
  --shadow:0 24px 60px rgba(0,0,0,.08);
  --radius:26px;
  --max:1120px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 10% 18%, rgba(255,182,193,.20), transparent 0 24%),
    radial-gradient(circle at 82% 14%, rgba(143,188,255,.18), transparent 0 25%),
    radial-gradient(circle at 70% 78%, rgba(196,167,255,.16), transparent 0 24%),
    radial-gradient(circle at 22% 85%, rgba(255,220,160,.16), transparent 0 22%),
    linear-gradient(135deg,#fdfcff 0%, #f5f8ff 38%, #eef8ff 100%);
  background-attachment: fixed;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  animation:bgShift 18s ease-in-out infinite alternate;
}

@keyframes bgShift{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(14deg);}
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(0,0,0,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.022) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(circle at center, black 42%, transparent 92%);
  opacity:.40;
}

a{color:inherit;text-decoration:none}
button{font:inherit}

.scroll-progress{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:3px;
  z-index:40;
  background:rgba(0,0,0,.06);
}

.scroll-progress span{
  display:block;
  height:100%;
  width:100%;
